<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>StakeJoy Copilot - 智能写作助手</title>

    <!-- Office JavaScript API -->
    <script type="text/javascript" src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>

    <!-- Fluent UI -->
    <link rel="stylesheet" href="https://res-1.cdn.office.net/files/fabric-cdn-prod_20230815.002/office-ui-fabric-core/11.1.0/css/fabric.min.css"/>

    <!-- Template styles -->
    <link href="taskpane.css" rel="stylesheet" type="text/css" />
</head>

<body class="ms-font-m ms-Fabric">
    <header class="app-header ms-bgColor-themePrimary">
        <img width="50" height="50" src="../../assets/logo.png" alt="StakeJoy Copilot" title="StakeJoy Copilot" />
        <h1 class="ms-font-xl ms-fontColor-white">StakeJoy Copilot</h1>
    </header>
    
    <!-- 角色选择区域 -->
    <div class="role-selector-section">
        <label class="role-label">选择 AI 角色：</label>
        <select id="roleSelector" class="role-select">
            <option value="default">💼 通用助手</option>
            <option value="storyteller">📖 讲故事的人</option>
            <option value="writer">✍️ 文章润色</option>
            <option value="novelist">📚 小说家</option>
            <option value="poet">🎭 诗人</option>
            <option value="teacher">👨‍🏫 英语教官</option>
            <option value="programmer">💻 程序员</option>
            <option value="marketer">📊 营销专家</option>
            <option value="consultant">🎯 旅游顾问</option>
            <option value="twitter">🐦 推特文章创作</option>
            <option value="crypto">💰 币圈分析家</option>
        </select>
        <p id="roleDescription" class="role-description">通用 AI 助手，可以帮助你完成各种写作任务</p>
    </div>
    
    <section id="sideload-msg" class="ms-welcome__main">
        <h2 class="ms-font-xl">请先<a target="_blank" href="https://learn.microsoft.com/office/dev/add-ins/testing/test-debug-office-add-ins#sideload-an-office-add-in-for-testing">加载</a>插件</h2>
    </section>
    
    <main id="app-body" class="app-main" style="display: none;">
        <!-- 功能区域 -->
        <div class="feature-section">
            <h3 class="ms-font-l section-title">📝 选中文本分析</h3>
            <p class="ms-font-s description">选中文档中的文字，AI 将为你提供智能分析和建议</p>
            <button id="analyzeBtn" class="ms-Button ms-Button--primary">
                <span class="ms-Button-label">分析选中文本</span>
            </button>
        </div>

        <div class="feature-section">
            <h3 class="ms-font-l section-title">✏️ 文本扩写/缩写</h3>
            <p class="ms-font-s description">选中文档中的文字，AI 将帮你扩写或缩写内容</p>
            <div class="rewrite-controls">
                <div class="control-group">
                    <label class="ms-font-s">操作类型：</label>
                    <select id="rewriteType" class="select-input">
                        <option value="expand">扩写</option>
                        <option value="compress">缩写</option>
                    </select>
                </div>
                <div class="control-group">
                    <label class="ms-font-s">目标字数：</label>
                    <input type="number" id="targetWords" class="number-input" placeholder="例如：500" min="50" max="5000" value="300" />
                </div>
            </div>
            <button id="rewriteBtn" class="ms-Button ms-Button--primary">
                <span class="ms-Button-label">开始改写</span>
            </button>
        </div>

        <div class="feature-section">
            <h3 class="ms-font-l section-title">✨ AI 生成内容</h3>
            <textarea id="promptInput" class="input-area large-input" placeholder="输入你的需求，例如：写一段关于人工智能的介绍..." rows="6"></textarea>
            <button id="generateBtn" class="ms-Button ms-Button--primary">
                <span class="ms-Button-label">生成内容</span>
            </button>
        </div>

        <div class="feature-section">
            <h3 class="ms-font-l section-title">📄 Excel 数据导入</h3>
            <p class="ms-font-s description">上传 Excel 文件，AI 将分析数据并生成报告</p>
            <input type="file" id="excelInput" accept=".xlsx,.xls" class="file-input" />
            <button id="uploadBtn" class="ms-Button ms-Button--primary">
                <span class="ms-Button-label">分析 Excel</span>
            </button>
        </div>

        <!-- 结果显示区域 -->
        <div id="resultSection" class="result-section" style="display: none;">
            <h3 class="ms-font-l section-title">💡 AI 分析结果</h3>
            <div id="resultContent" class="result-content"></div>
            <button id="insertBtn" class="ms-Button ms-Button--hero">
                <span class="ms-Button-label">插入到文档</span>
            </button>
        </div>

        <!-- 状态提示 -->
        <div id="statusMsg" class="status-msg"></div>
        
        <!-- 加载动画 -->
        <div id="loadingOverlay" class="loading-overlay" style="display: none;">
            <div class="loading-spinner">
                <div class="spinner"></div>
                <p id="loadingText" class="loading-text">AI 正在生成中...</p>
            </div>
        </div>
    </main>
</body>

</html>
